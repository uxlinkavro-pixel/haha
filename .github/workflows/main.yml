name: 16-32GB Free Windows RDP (No Card)

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Boost Memory to 32GB (Pagefile)
        run: |
          $wmi = Get-CimInstance Win32_ComputerSystem
          $wmi.AutomaticManagedPagefile = $false
          Set-CimInstance -CimInstance $wmi
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue
          
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("RAM: {0:N2} GB" -f ($os.TotalVisibleMemorySize / 1MB))
          Write-Host ("Total Addressable Memory: 32 GB")

      - name: 2. Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: 3. Set Windows User & Password
        run: |
          $user = "runneradmin"
          $pass = "FreeRdp@2026SG"
          net user $user $pass
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

      - name: 4. Download and Start Playit.gg (No Card Required)
        run: |
          New-Item -ItemType Directory -Force -Path "C:\playit"
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile "C:\playit\playit.exe"
          
          # Start Playit agent in background
          Start-Process -FilePath "C:\playit\playit.exe" -RedirectStandardOutput "C:\playit\playit.log" -RedirectStandardError "C:\playit\error.log"
          
          Write-Host "Playit agent launched. Generating your tunnel address..."
          Start-Sleep -Seconds 12

      - name: 5. Display Connection Information
        run: |
          Write-Host "`n========================================================"
          Write-Host "                PLAYIT CONNECTION LOGS                 "
          Write-Host "========================================================"
          
          # Read Playit log to show the connection link
          if (Test-Path "C:\playit\playit.log") {
              Get-Content "C:\playit\playit.log" | Select-String -Pattern "claim|visit|ply.gg|connect" | ForEach-Object { Write-Host $_.Line }
              Get-Content "C:\playit\playit.log" | Select-Object -Last 10 | ForEach-Object { Write-Host $_ }
          }
          
          Write-Host "`n========================================================"
          Write-Host " Username : runneradmin"
          Write-Host " Password : FreeRdp@2026SG"
          Write-Host " Hardware : 4 vCPU | 16 GB Physical RAM (32GB Total)"
          Write-Host "========================================================`n"

      - name: Keep Server Alive
        run: |
          $counter = 0
          while ($true) {
              if (Test-Path "C:\playit\playit.log") {
                  $latest = Get-Content "C:\playit\playit.log" -Tail 2
                  Write-Host "[$(Get-Date)] Status: $latest"
              }
              Start-Sleep -Seconds 60
              $counter++
          }
