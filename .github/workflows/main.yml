name: Real Singapore Windows RDP (16-32GB)

on:
  workflow_dispatch:

jobs:
  singapore-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Boost Memory to 32GB (Pagefile)
        run: |
          $wmi = Get-CimInstance Win32_ComputerSystem
          $wmi.AutomaticManagedPagefile = $false
          Set-CimInstance -CimInstance $wmi
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=16384; MaximumSize=16384} -ErrorAction SilentlyContinue
          
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("RAM: {0:N2} GB" -f ($os.TotalVisibleMemorySize / 1MB))

      - name: 2. Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: 3. Create Windows User
        run: |
          $password = "FreeRdp@SG2026"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "AdministratorRDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "AdministratorRDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AdministratorRDP"

      - name: 4. Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait

      - name: 5. Connect to Singapore Mesh Network
        run: |
          # Connects runner to Tailscale
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=singapore-rdp-$env:GITHUB_RUN_ID --accept-routes
          
          $tsIP = $null
          $i = 0
          while (-not $tsIP -and $i -lt 15) {
              Start-Sleep -Seconds 3
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              $i++
          }

          # Check Public IP and Location
          $ipInfo = Invoke-RestMethod -Uri "https://ipinfo.io/json" -ErrorAction SilentlyContinue

          Write-Host "`n========================================================"
          Write-Host "           SINGAPORE RDP SERVER ONLINE                  "
          Write-Host "========================================================"
          Write-Host " Tailscale IP : $tsIP"
          Write-Host " Username     : AdministratorRDP"
          Write-Host " Password     : FreeRdp@SG2026"
          Write-Host " Hardware     : 4 Cores | 16 GB RAM (32 GB Virtual)"
          Write-Host "========================================================`n"

      - name: Keep Server Running
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Singapore Server is active..."
              Start-Sleep -Seconds 300
          }
